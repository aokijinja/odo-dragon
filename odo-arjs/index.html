<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>小戸の池の龍神さま｜AR.js比較</title>
<style>
  body { margin: 0; overflow: hidden; background: #101e25; color: white; font: 16px system-ui, sans-serif; }
  header, footer { position: fixed; z-index: 10; left: 16px; right: 16px; padding: 14px; border-radius: 14px; background: #102d3aee; }
  header { top: max(16px, env(safe-area-inset-top)); font-weight: bold; }
  footer { bottom: max(16px, env(safe-area-inset-bottom)); }
  p { margin: 0; }
  button { margin-top: 10px; padding: 10px 18px; border: 0; border-radius: 8px; color: #102d3a; background: #eaf6ff; font: inherit; font-weight: bold; }
</style>
<script defer src="https://cdn.jsdelivr.net/gh/aframevr/aframe@1.6.0/dist/aframe-master.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.7/aframe/build/aframe-ar-nft.js"></script>
<script defer src="./comparison.js"></script>
<body>
<header>小戸の池の龍神さま｜AR.js比較</header>
<footer>
  <p id="status" role="status">ARを開始し、白い「小戸池」の案内板にカメラを向けてください。</p>
  <button id="start" type="button">ARを開始</button>
</footer>
<template id="experience">
  <a-scene embedded vr-mode-ui="enabled: false" loading-screen="enabled: false"
    renderer="antialias: true" arjs="trackingMethod: best; sourceType: webcam; cameraParametersUrl: ./camera_para.dat; debugUIEnabled: false">
    <a-nft type="nft" url="./sign" emitevents="true" smooth="true"
      smooth-count="10" smooth-tolerance="0.01" smooth-threshold="5">
      <a-entity id="placement" rotation="-90 0 0">
        <a-entity id="dragon" gltf-model="url(./Aoki_Odo_Dragon_Silver_Blue_v22.glb)"></a-entity>
      </a-entity>
    </a-nft>
    <a-entity camera look-controls="enabled: false" wasd-controls="enabled: false"></a-entity>
  </a-scene>
</template>
</body>
</html>
